name: OCI Free CI Pilot (manual)

# Never schedule a job until a real repository-scoped ARM64 runner is online.
# This workflow only runs when explicitly dispatched by the repository owner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Validate HEARD on private cloud runner
    runs-on: [self-hosted, Linux, ARM64, oci-free]
    timeout-minutes: 15
    steps:
      - name: Confirm dedicated runner properties
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          printf 'Cloud runner active: %s, %s\n' "$(uname -s)" "$(uname -m)"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Existing HEARD quality gate, unchanged
        run: npm run check
