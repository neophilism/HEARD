version: 2.1

# Native CircleCI job. Mirrors every command of .github/workflows/foundation.yml.
# Do not weaken the gate to accommodate an unavailable provider.
jobs:
  full-verification:
    docker:
      - image: cimg/node:22.23.3
    resource_class: small
    steps:
      - checkout
      - run:
          name: Confirm correct Node.js version
          command: node --version
      - run:
          name: Foundation and regression tests (complete existing CI)
          command: npm run check

workflows:
  full-ci:
    jobs:
      - full-verification
