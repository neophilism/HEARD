# Scoped proposal for .github/workflows/foundation.yml, subject to existing authorization.
name: HEARD foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:database
      - run: npm run test:database:wasm
      - run: npm audit --audit-level=high
